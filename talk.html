<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>چای قندپهلو | کافه دوتایی‌ها</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f7f1eb;
      color: #3f3530;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .cafe {
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(70, 50, 40, 0.12);
    }

    .cup {
      font-size: 55px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 30px;
      color: #5a4035;
      margin-bottom: 15px;
    }

    .intro {
      font-size: 17px;
      line-height: 2;
      color: #76645b;
      margin-bottom: 25px;
    }

    .writing-box {
      background: #f8eee7;
      border-radius: 20px;
      padding: 18px;
    }

    textarea {
      width: 100%;
      min-height: 280px;
      border: none;
      outline: none;
      resize: vertical;
      border-radius: 15px;
      padding: 18px;
      font-family: inherit;
      font-size: 16px;
      line-height: 2;
      color: #3f3530;
      background: white;
    }

    textarea::placeholder {
      color: #a4938a;
    }

    .send {
      margin-top: 15px;
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      background: #8c6a5a;
      color: white;
    }

    #message {
      display: none;
      margin-top: 18px;
      background: white;
      border-radius: 15px;
      padding: 15px;
      line-height: 2;
      color: #5a4035;
    }

    .back {
      display: inline-block;
      margin-top: 22px;
      color: #8c6a5a;
      text-decoration: none;
      font-size: 14px;
    }

    footer {
      margin-top: 25px;
      font-size: 13px;
      color: #9a8880;
    }
  </style>
</head>

<body>

  <main class="cafe">

    <div class="cup">☕</div>

    <h1>چای قندپهلو</h1>

    <p class="intro">
      اینجا می‌توانی حرفت را بگویی.<br>
      لازم نیست مرتب بنویسی، لازم نیست همه‌چیز را توضیح بدهی.
      <br>
      از هر جایی که دلت خواست شروع کن.
    </p>

    

<form class="writing-box" action="https://formspree.io/f/mppzknrg" method="POST" onsubmit="sendMessage(event)">

  <textarea
    id="text"
    name="message"
    placeholder="هرچه در دلت هست، اینجا بنویس..."
    required
  ></textarea>

  <button class="send" type="submit">
    حرفم را بسپار ☕
  </button>

  <div id="message"></div>

</form>
    <a class="back" href="index.html">
      ← برگشت به کافه
    </a>

    <footer>
      کافه دوتایی‌ها · اینجا جایی برای قضاوت نیست
    </footer>

  </main>

  <script>
    function sendMessage() {
      const text = document.getElementById("text").value.trim();
      const message = document.getElementById("message");

      if (text === "") {
        message.innerHTML = "اول چند کلمه برای خودت بنویس؛ هرچقدر که دوست داری.";
      } else {
        message.innerHTML = "حرفت اینجا ماندگار شد. ❤️<br>فعلاً این نوشته فقط روی همین صفحه است و جایی ارسال نمی‌شود.";
      }

      message.style.display = "block";
    }
  </script>



</body>
</html>
