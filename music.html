<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>دمنوش آرام‌بخش | کافه دوتایی‌ها</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f5efe8;
      font-family: Tahoma, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #5b4a40;
    }

    .cafe {
      width: 100%;
      max-width: 650px;
      background: white;
      border-radius: 28px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(70, 50, 40, 0.12);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 20px;
    }

    p {
      line-height: 2;
      margin-bottom: 30px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
      background: #e8d8c8;
      color: #5b4a40;
    }

    button:hover {
      opacity: 0.85;
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: #806451;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }

    audio {
      width: 100%;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="cafe">

    <h1>🌿 دمنوش آرام‌بخش</h1>

    <p>
      لازم نیست کاری انجام بدهی.<br>
      فقط چند دقیقه بنشین، نفس بکش و گوش بده. 🤍
    </p>

    <audio controls>
      <source src="leberch-peaceful-piano-576857%20(1).mp3" type="audio/mpeg">
      مرورگر شما از پخش موسیقی پشتیبانی نمی‌کند.
    </audio>

    <br>

    <a class="back" href="index.html">
      ← برگشت به کافه
    </a>

  </div>

</body>
</html>
