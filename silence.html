<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کمی سکوت | کافه دوتایی‌ها</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, sans-serif;
      background: #f7f1ea;
      color: #4d4038;
      min-height: 100vh;
      padding: 25px 15px;
    }

    .cafe {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(70, 50, 40, 0.12);
    }

    h1 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .intro {
      line-height: 2;
      color: #806f63;
      margin-bottom: 30px;
    }

    .mood {
      display: block;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      margin: 12px 0;
      background: #fff8f1;
      color: #5b4a40;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .mood:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(70, 50, 40, 0.08);
    }
.text {
  text-align: right;
  line-height: 2.2;
  color: #5b4a40;
  margin: 25px 5px;
}

.text p {
  margin-bottom: 18px;
}
    .back {
      display: inline-block;
      margin-top: 25px;
      color: #806451;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="cafe">

    <h1>کمی سکوت 🌿</h1>

    <p class="intro">
      نمی‌دانی چه می‌خواهی؟<br>
      اشکالی ندارد...<br>
      شاید یکی از این‌ها امروز کمی شبیه حال تو باشد.
    </p>

    <button class="mood" onclick="showText(1)">🌧️ امروز دلم گرفته</button>
<button class="mood" onclick="showText(2)">😂 امروز فقط می‌خوام بخندم</button>
    

    <button class="mood" onclick="showText(3)">🌿 امروز هیچی نمی‌خوام</button>

    <button class="mood" onclick="showText(4)">🪟 امروز دلم یک پنجره می‌خواهد</button>

    <button class="mood" onclick="showText(5)">🫖 دلم یک هم‌صحبت می‌خواهد</button>
    <button class="mood">🎈 امروز الکی خوشم!</button>

            
    
<script>
  function showText(number) {

    if (number === 1) {

      document.querySelector(".cafe").innerHTML = `
        <h1>🌧️ امروز دلم گرفته</h1>

        <div class="text">

          <p>گاهی آدم خسته نیست؛<br>
          فقط از این‌همه «خوبم» گفتن خسته است.</p>

          <p>از اینکه هر بار چیزی در دلش فرو می‌ریزد،<br>
          آرام جمعش کند و کسی نفهمد.</p>

          <p>گاهی آدم دلش می‌خواهد<br>
          یکی فقط کنارش بنشیند.</p>

          <p>نه برای اینکه راه‌حل بدهد،<br>
          نه برای اینکه بگوید «قوی باش».</p>

          <p>فقط باشد.</p>

          <p>گاهی همین بودن،<br>
          بیشتر از هزار جمله آرامش می‌دهد.</p>

          <p>اگر امروز دلت گرفته،<br>
          لازم نیست وانمود کنی خوب هستی.</p>

          <p>امروز می‌توانی فقط همین‌جا باشی.<br>
          نفس بکشی.<br>
          چایت را آرام بنوشی.</p>

          <p>و اجازه بدهی دلت کمی سبک شود.</p>

          <p>هیچ عجله‌ای نیست.</p>

          <p>و اگر بعد از این سکوت دلت خواست چیزی بگویی،<br>
          چای قندپهلو هنوز گرم است. ☕🤍</p>

        </div>

        <a class="back" href="silence.html">
          ← برگشت به کمی سکوت
        </a>
      `;

    }

    if (number === 2) {

      document.querySelector(".cafe").innerHTML = `
        <h1>😂 امروز فقط می‌خوام بخندم</h1>

        <div class="text">

          <p>امروز تصمیم گرفتم آدم خیلی عاقل و بالغی باشم.</p>

          <p>صبح با خودم گفتم:<br>
          «دیگه از امروز همه‌چیز رو با آرامش حل می‌کنم.»</p>

          <p>بعد جورابم رو پوشیدم و دیدم یکی از لنگه‌ها نیست.</p>

          <p>پنج دقیقه دنبالش گشتم.<br>
          پیدا نشد.</p>

          <p>آخرش با خودم گفتم:<br>
          «خب... شاید اون هم امروز نیاز به تنهایی داشته.» 😂</p>

          <p>بعضی روزها واقعاً همین‌طوری‌اند.</p>

          <p>هرچقدر هم بخواهی همه‌چیز را مرتب و منطقی پیش ببری،<br>
          زندگی یک گوشه می‌ایستد و می‌گوید:<br>
          «ببینم حالا با این یکی چه کار می‌کنی؟!»</p>

          <p>پس شاید بد نباشد گاهی به جای حرص خوردن،<br>
          کمی بخندیم.</p>

          <p>به اشتباهاتمان.<br>
          به برنامه‌هایی که نصفه ماندند.<br>
          به چیزهایی که قرار بود پنج دقیقه طول بکشند و دو ساعت طول کشیدند.</p>

          <p>به خودمان که با این همه جدیت،<br>
          هنوز نمی‌توانیم یک جفت جوراب را کنار هم نگه داریم. 😂</p>

          <p>اگر امروز همه‌چیز طبق برنامه پیش نرفت،<br>
          اشکالی ندارد.</p>

          <p>زندگی فردا هم هست که دوباره خرابش کنیم.</p>

          <p>و عجیب اینکه همین «گذشتن»<br>
          گاهی خودش یک جور موفقیت است.</p>

          <p>پس امروز اگر کاری از دستت برنیامد،<br>
          حداقل یک کار را انجام بده:</p>

          <p>بخند.</p>

          <p>حتی اگر دلیل خاصی نداری. 🤍</p>

        </div>

        <a class="back" href="silence.html">
          ← برگشت به کمی سکوت
        </a>
      `;
    }
    if (number === 3) {

      document.querySelector(".cafe").innerHTML = `
        <h1>🌿 امروز هیچی نمی‌خوام</h1>

        <div class="text">

          <p>امروز دلم نمی‌خواهد چیزی بخواهم.</p>

          <p>نه تصمیمی دارم،<br>
          نه برنامه‌ای،<br>
          نه حتی یک جمله‌ی قشنگ که آخرش نتیجه بگیرم «و زندگی ادامه دارد».</p>

          <p>امروز اگر زندگی زنگ بزند، ترجیح می‌دهم گوشی را روی بی‌صدا بگذارم.</p>

          <p>اگر کسی پرسید «چه خبر؟»<br>
          احتمالاً جواب می‌دهم: «هیچی.»</p>

          <p>و منظورم واقعاً «هیچی» است.</p>

          <p>دلم می‌خواهد یک گوشه بنشینم، چایم را بخورم و برای چند دقیقه هیچ مسئله‌ای را حل نکنم.</p>

          <p>نه اینکه ناراحت باشم.</p>

          <p>فقط حوصله ندارم مدیرعامل زندگی خودم باشم.</p>

          <p>یک روز هم بگذار زندگی خودش یک کاری بکند! 😂</p>

          <p>همیشه قرار نیست بدانیم قدم بعدی چیست.</p>

          <p>گاهی قدم بعدی این است که یک پتو برداریم،<br>
          یک چیزی بخوریم،<br>
          به سقف نگاه کنیم<br>
          و با خودمان قرار بگذاریم که امروز قرار نیست شاهکار کنیم.</p>

          <p>شاید فردا دوباره دلمان خواست برنامه بریزیم،<br>
          هدف تعیین کنیم،<br>
          دنیا را نجات بدهیم<br>
          و حتی جوراب‌های گمشده‌مان را پیدا کنیم.</p>

          <p>اما امروز نه.</p>

          <p>امروز فقط می‌خواهم همین‌جا باشم.</p>

          <p>بی‌دلیل.</p>

          <p>بی‌برنامه.</p>

          <p>بی‌تلاش برای اینکه از خودم آدم بهتری بسازم.</p>

          <p>فقط خودم.</p>

          <p>و شاید همین هم برای یک روز کافی باشد. 🤍</p>

        </div>

        <a class="back" href="silence.html">
          ← برگشت به کمی سکوت
        </a>
      `;

     }
    if (number === 4) {

      document.querySelector(".cafe").innerHTML = `
        <h1>🪟 امروز دلم یک پنجره می‌خواهد</h1>

        <div class="text">

  <p>امروز از خواب بیدار شدم و به اطرافم نگاه کردم اما... انگار در خانه خودم نبودم.</p>

  <p>چشم‌هایم را بستم و دوباره باز کردم.</p>

  <p>نه... واقعاً در خانه خودم نبودم.</p>

  <p>بلند شدم و در جایم نشستم.</p>

  <p>من دیشب روی تختم خوابیده بودم اما الان روی تشک از خواب بیدار شدم.</p>

  <p>رویم لحاف مخمل قرمز، از همان‌هایی که مادرم با سوزن می‌دوخت، بود.</p>

  <p>از رختخواب بیرون آمدم و به اطراف نگاه کردم.</p>

  <p>روبرویم پنجره‌هایی بزرگ بود که سرتاسر شیشه‌های رنگی داشت.</p>

  <p>گذشتن نور خورشید از این همه رنگ دیدنی بود.</p>

  <p>زیر پاهایم فرش دست‌بافت قرمز رنگ بود و پرده‌های مخمل زیبا کنار پنجره‌ها قرار داشت.</p>

  <p>کنار پنجره رفتم و بیرون را نگاه کردم.</p>

  <p>حوض فیروزه‌ای‌رنگ وسط حیاط، با فواره‌ای در وسطش، آب را به آسمان می‌پاشید و رنگین‌کمان‌های کوچکی در هوا درست می‌کرد.</p>

  <p>یکهو در انعکاس شیشه پنجره متوجه خودم شدم.</p>

  <p>چه لباس زیبایی بر تن داشتم.</p>

  <p>لباسی صورتی‌رنگ به همراه دامن ساتن همان رنگی و شلواری که روی مچ پا کش داشت و با پولک‌دوزی‌های زیبایی تزیین شده بود.</p>

  <p>موهایم بلند، مشکی و لخت روی شانه‌هایم ریخته بود؛ مثل همان وقت‌ها که دختر خانه بودم و از رنگ و کراتین و مش و این‌ها خبری نبود.</p>

  <p>محو محیط و لباس‌ها شده بودم.</p>

  <p>صدای آشنای چرخی را از کوچه شنیدم:</p>

  <p>«ای لبو! بدو، لبوی داغ و شیرین آوردم! بدو، لبوی خوشمزه...»</p>

  <p>لب پنجره نشستم.</p>

  <p>با خودم فکر می‌کردم چقدر همه چیز خوب و آرام بود.</p>

  <p>قشنگی رنگ‌ها، آرامش، سادگی، بوی خوب گذشته.</p>

  <p>نه استرس بیشتر داشتن، نه استرس چیزهای جدید و ترند.</p>

  <p>آره، سختی بود. همیشه بوده.</p>

  <p>ولی دلم می‌خواست همان‌جا بمانم؛ وسط تمام آن سختی‌ها، با بوی خوب حیاط آب‌زده، با حوض وسط حیاط و ماهی‌گلی‌ها، با صدای چرخی لبو‌فروش، با آفتاب شیشه‌های رنگی...</p>

  <p>چشم‌هایم را باز کردم.</p>

  <p>دیشب خواب زیبایی دیده بودم. 🤍</p>

</div>

        <a class="back" href="silence.html">
          ← برگشت به کمی سکوت
        </a>
      `;
    }
  }
    if (number === 5) {

      document.querySelector(".cafe").innerHTML = `
        <h1>🫖 دلم یک هم‌صحبت می‌خواهد</h1>

        <div class="text">

          <p>گاهی دلم یک هم‌صحبت می‌خواهد.</p>

          <p>نه کسی که جواب همه‌چیز را بداند...</p>

        </div>

        <a class="back" href="silence.html">
          ← برگشت به کمی سکوت
        </a>
      `;

    }
</script>
</body>

</html>
