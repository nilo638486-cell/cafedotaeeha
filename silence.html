<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کمی سکوت | کافه دوتایی‌ها</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, sans-serif;
      background: #f7f1ea;
      color: #4d4038;
      min-height: 100vh;
      padding: 25px 15px;
    }

    .cafe {
      width: 100%;
      max-width: 650px;
      margin: 30px auto;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(70, 50, 40, 0.12);
    }

    h1 {
      font-size: 27px;
      margin-bottom: 12px;
    }

    .intro {
      line-height: 2;
      color: #806f63;
      margin-bottom: 30px;
    }

    .mood {
      display: block;
      width: 100%;
      border: none;
      border-radius: 18px;
      padding: 18px;
      margin: 12px 0;
      background: #fff8f1;
      color: #5b4a40;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .mood:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(70, 50, 40, 0.08);
    }
.text {
  text-align: right;
  line-height: 2.2;
  color: #5b4a40;
  margin: 25px 5px;
}

.text p {
  margin-bottom: 18px;
}
    .back {
      display: inline-block;
      margin-top: 25px;
      color: #806451;
      text-decoration: none;
      font-size: 14px;
    }

    .back:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="cafe">

    <h1>کمی سکوت 🌿</h1>

    <p class="intro">
      نمی‌دانی چه می‌خواهی؟<br>
      اشکالی ندارد...<br>
      شاید یکی از این‌ها امروز کمی شبیه حال تو باشد.
    </p>

    <button class="mood" onclick="showText(1)">🌧️ امروز دلم گرفته</button>

    <button class="mood">😂 امروز فقط می‌خوام بخندم</button>

    <button class="mood">🌿 امروز هیچی نمی‌خوام</button>

    <button class="mood">🪟 امروز دلم یک پنجره می‌خواهد</button>

    <button class="mood">🫖 دلم یک هم‌صحبت می‌خواهد</button>

    <button class="mood">🎈 امروز الکی خوشم!</button>

    <a class="back" href="index.html">
      ← برگشت به کافه
    </a>

  </div>
<script>
  function showText(number) {

    if (number === 1) {

      document.querySelector(".cafe").innerHTML = `
        <h1>🌧️ امروز دلم گرفته</h1>

        <div class="text">
          <p>گاهی آدم خسته نیست؛</p>

          <p>فقط از این‌همه «خوبم» گفتن خسته است.</p>

          <p>از اینکه هر بار چیزی در دلش فرو می‌ریزد،<br>
          آرام جمعش کند و کسی نفهمد.</p>

          <p>گاهی آدم دلش می‌خواهد<br>
          یکی فقط کنارش بنشیند.</p>

          <p>نه برای اینکه راه‌حل بدهد،<br>
          نه برای اینکه بگوید «قوی باش».</p>

          <p>فقط باشد.</p>

          <p>گاهی همین بودن،<br>
          بیشتر از هزار جمله آرامش می‌دهد.</p>

          <p>اگر امروز دلت گرفته،<br>
          لازم نیست وانمود کنی خوب هستی.</p>

          <p>امروز می‌توانی فقط همین‌جا باشی.</p>

          <p>نفس بکشی.<br>
          چایت را آرام بنوشی.<br>
          و اجازه بدهی دلت کمی سبک شود.</p>

          <p>هیچ عجله‌ای نیست.</p>

          <p>و اگر بعد از این سکوت دلت خواست چیزی بگویی،<br>
          چای قندپهلو هنوز گرم است. ☕🤍</p>
        </div>

        <a class="back" href="silence.html">
          ← برگشت به کمی سکوت
        </a>
      `;
    }
  }
</script>
</body>

</html>
